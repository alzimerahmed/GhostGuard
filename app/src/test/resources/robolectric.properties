# Pin Robolectric to SDK 35 (Android 15).
# targetSdk is 36 (Android 16), but Robolectric 4.16 does not ship an
# android-all-instrumented jar for SDK 36 — on a fresh CI runner it throws
# UnsupportedOperationException at DefaultSdkProvider. SDK 35 is the highest
# level Robolectric 4.16 supports and is sufficient for all unit tests here.
sdk=35
